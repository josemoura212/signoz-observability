# =============================================================================
# agent-kafka — STACK SWARM (deploy via Portainer Repository ou `docker stack deploy`).
#
#   otel-agent          -> mode: global  (1 por node: hostmetrics + kafkametrics + OTLP)
#   jmx-scraper-brokerN -> replicas: 1   (1 por broker; placement fixo no node do broker)
#
# Config do collector via --config=URL do GitHub raw (regra do projeto).
# Scrapers: imagem publica + baixam o jar no start (SHA-256 verificado fail-closed)
# e leem a config de um arquivo .properties (-config <arquivo>; NAO aceita pares inline).
# ENV stack: SIGNOZ_ENDPOINT, KAFKA_BROKERS (so o valor, ex 10.0.0.83:1234 — 1 broker).
# =============================================================================
services:
  otel-agent:
    image: otel/opentelemetry-collector-contrib:0.146.0
    hostname: '{{.Node.Hostname}}'
    command: ['--config=https://raw.githubusercontent.com/josemoura212/signoz-observability/main/agent-kafka/otel-agent-config.yaml']
    volumes:
      - /:/hostfs:ro
      - /etc/passwd:/etc/passwd:ro
    environment:
      HOST_PROC: /hostfs/proc
      HOST_SYS: /hostfs/sys
      HOST_ETC: /hostfs/etc
      HOST_VAR: /hostfs/var
      SIGNOZ_ENDPOINT: ${SIGNOZ_ENDPOINT}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-localhost:9092}
    networks:
      - hostnet
    pid: host
    deploy:
      mode: global
      restart_policy:
        condition: any
        delay: 5s
    logging:
      options:
        max-size: '20m'
        max-file: '3'

  # ===========================================================================
  # JMX scrapers — 1 por broker. Cada um raspa o JMX :9999 do SEU broker (broker+JVM)
  # e exporta OTLP pro SigNoz. placement fixa no node do broker (nao roda nos consumers).
  # SEGURANCA: jar verificado por SHA-256 (fail-closed) antes do exec.
  #   Ao trocar a versao do jar, ATUALIZE o hash: sha256sum opentelemetry-jmx-scraper.jar
  # NOTA: o jmx-scraper le config de ARQUIVO (-config /tmp/jmx.properties); NAO aceita
  #   pares key=value inline (daria "Unexpected number of arguments").
  # ===========================================================================
  jmx-scraper-broker1:
    image: eclipse-temurin:21-jre-alpine
    networks: [hostnet]
    command:
      - sh
      - -c
      - >-
        wget -qO /tmp/scraper.jar
        https://github.com/open-telemetry/opentelemetry-java-contrib/releases/download/v1.57.0/opentelemetry-jmx-scraper.jar
        && echo '626428c20b254ad8c9ccf5c2c09f297db7bd4498748a2ab5581038b7a9c590fe  /tmp/scraper.jar' > /tmp/scraper.jar.sha256
        && sha256sum -c /tmp/scraper.jar.sha256
        && printf '%s\n'
        'otel.jmx.service.url=service:jmx:rmi:///jndi/rmi://10.0.0.83:9999/jmxrmi'
        'otel.jmx.target.system=jvm,kafka'
        'otel.metrics.exporter=otlp'
        'otel.exporter.otlp.protocol=grpc'
        'otel.exporter.otlp.endpoint=http://${SIGNOZ_ENDPOINT}:4317'
        'otel.metric.export.interval=30000'
        'otel.service.name=kafka'
        'otel.resource.attributes=host.name=kafka-broker-1,kafka.broker.id=1,server.address=10.0.0.83'
        > /tmp/jmx.properties
        && exec java -Xmx64m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k
        -jar /tmp/scraper.jar -config /tmp/jmx.properties
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 256M
      placement:
        constraints: ['node.hostname == unni-kafka']
    logging:
      options:
        max-size: '20m'
        max-file: '3'

  jmx-scraper-broker2:
    image: eclipse-temurin:21-jre-alpine
    networks: [hostnet]
    command:
      - sh
      - -c
      - >-
        wget -qO /tmp/scraper.jar
        https://github.com/open-telemetry/opentelemetry-java-contrib/releases/download/v1.57.0/opentelemetry-jmx-scraper.jar
        && echo '626428c20b254ad8c9ccf5c2c09f297db7bd4498748a2ab5581038b7a9c590fe  /tmp/scraper.jar' > /tmp/scraper.jar.sha256
        && sha256sum -c /tmp/scraper.jar.sha256
        && printf '%s\n'
        'otel.jmx.service.url=service:jmx:rmi:///jndi/rmi://10.0.0.221:9999/jmxrmi'
        'otel.jmx.target.system=jvm,kafka'
        'otel.metrics.exporter=otlp'
        'otel.exporter.otlp.protocol=grpc'
        'otel.exporter.otlp.endpoint=http://${SIGNOZ_ENDPOINT}:4317'
        'otel.metric.export.interval=30000'
        'otel.service.name=kafka'
        'otel.resource.attributes=host.name=kafka-broker-2,kafka.broker.id=2,server.address=10.0.0.221'
        > /tmp/jmx.properties
        && exec java -Xmx64m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k
        -jar /tmp/scraper.jar -config /tmp/jmx.properties
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 256M
      placement:
        constraints: ['node.hostname == unni-kafka-02']
    logging:
      options:
        max-size: '20m'
        max-file: '3'

  jmx-scraper-broker3:
    image: eclipse-temurin:21-jre-alpine
    networks: [hostnet]
    command:
      - sh
      - -c
      - >-
        wget -qO /tmp/scraper.jar
        https://github.com/open-telemetry/opentelemetry-java-contrib/releases/download/v1.57.0/opentelemetry-jmx-scraper.jar
        && echo '626428c20b254ad8c9ccf5c2c09f297db7bd4498748a2ab5581038b7a9c590fe  /tmp/scraper.jar' > /tmp/scraper.jar.sha256
        && sha256sum -c /tmp/scraper.jar.sha256
        && printf '%s\n'
        'otel.jmx.service.url=service:jmx:rmi:///jndi/rmi://10.0.0.166:9999/jmxrmi'
        'otel.jmx.target.system=jvm,kafka'
        'otel.metrics.exporter=otlp'
        'otel.exporter.otlp.protocol=grpc'
        'otel.exporter.otlp.endpoint=http://${SIGNOZ_ENDPOINT}:4317'
        'otel.metric.export.interval=30000'
        'otel.service.name=kafka'
        'otel.resource.attributes=host.name=kafka-broker-3,kafka.broker.id=4,server.address=10.0.0.166'
        > /tmp/jmx.properties
        && exec java -Xmx64m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k
        -jar /tmp/scraper.jar -config /tmp/jmx.properties
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 256M
      placement:
        constraints: ['node.hostname == unni-kafka-03']
    logging:
      options:
        max-size: '20m'
        max-file: '3'

networks:
  hostnet:
    external: true
    name: host
