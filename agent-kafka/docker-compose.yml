# =============================================================================
# agent-kafka — STACK SWARM (deploy via `docker stack deploy` ou Portainer).
#
#   otel-agent         -> mode: global  (1 por node; hostmetrics + kafkametrics + otlp)
#   jmx-scraper-brokerN -> replicas: 1  (1 por broker; JMX broker+JVM via RMI :9999)
#
# Config do collector SEMPRE do GitHub raw (--config=URL), como exigido.
# Os scrapers usam config INLINE (-config <pares>), sem arquivo local; baixam o
# jar no start (mesmo padrão do otel-agent que baixa a config do GitHub no start).
# =============================================================================
services:
  otel-agent:
    image: otel/opentelemetry-collector-contrib:0.146.0
    # {{.Node.Hostname}} -> cada node reporta seu host.name (unni-kafka, unni-kafka-02, ...)
    hostname: '{{.Node.Hostname}}'
    command: ['--config=https://raw.githubusercontent.com/josemoura212/signoz-observability/main/agent-kafka/otel-agent-config.yaml']
    volumes:
      - /:/hostfs:ro
      - /etc/passwd:/etc/passwd:ro
    environment:
      HOST_PROC: /hostfs/proc
      HOST_SYS: /hostfs/sys
      HOST_ETC: /hostfs/etc
      HOST_VAR: /hostfs/var
      SIGNOZ_ENDPOINT: ${SIGNOZ_ENDPOINT}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-localhost:9092}
    networks:
      - hostnet
    pid: host
    deploy:
      mode: global
      restart_policy:
        condition: any
        delay: 5s
    logging:
      options:
        max-size: '20m'
        max-file: '3'

  # ===========================================================================
  # JMX scrapers — 1 service por broker, replicas:1 (NÃO global -> não duplica,
  # não roda extra nos consumers). Cada um raspa o JMX :9999 do SEU broker (IP).
  # Imagem pública + baixa o jar no start (sem build/registry). network host.
  # Métricas: kafka.message.count (throughput REAL), kafka.network.io,
  # kafka.partition.under_replicated, kafka.controller.active.count,
  # kafka.isr.operation.count, kafka.request.*, jvm.memory.heap.*, jvm.gc.*, etc.
  # Brokers: 10.0.0.83 (id 1) | 10.0.0.221 (id 2) | 10.0.0.166 (id 4).
  # SEGURANCA: o jar baixado e verificado por SHA-256 (fail-closed) antes do exec.
  #   Ao trocar a versao do jar, ATUALIZE o hash: sha256sum opentelemetry-jmx-scraper.jar
  # ===========================================================================
  jmx-scraper-broker1:
    image: eclipse-temurin:21-jre-alpine
    networks: [hostnet]
    environment:
      OTEL_RESOURCE_ATTRIBUTES: 'host.name=kafka-broker-1,kafka.broker.id=1,server.address=10.0.0.83'
    command:
      - sh
      - -c
      - >-
        wget -qO /tmp/scraper.jar
        https://github.com/open-telemetry/opentelemetry-java-contrib/releases/download/v1.57.0/opentelemetry-jmx-scraper.jar
        && echo '626428c20b254ad8c9ccf5c2c09f297db7bd4498748a2ab5581038b7a9c590fe  /tmp/scraper.jar' > /tmp/scraper.jar.sha256
        && sha256sum -c /tmp/scraper.jar.sha256
        && exec java -Xmx64m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k
        -jar /tmp/scraper.jar -config
        otel.jmx.service.url=service:jmx:rmi:///jndi/rmi://10.0.0.83:9999/jmxrmi
        otel.jmx.target.system=jvm,kafka
        otel.metrics.exporter=otlp
        otel.exporter.otlp.protocol=grpc
        otel.exporter.otlp.endpoint=http://${SIGNOZ_ENDPOINT}:4317
        otel.metric.export.interval=30000
        otel.service.name=kafka
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 256M
      placement:
        constraints: ['node.hostname == unni-kafka']
    logging:
      options:
        max-size: '20m'
        max-file: '3'

  jmx-scraper-broker2:
    image: eclipse-temurin:21-jre-alpine
    networks: [hostnet]
    environment:
      OTEL_RESOURCE_ATTRIBUTES: 'host.name=kafka-broker-2,kafka.broker.id=2,server.address=10.0.0.221'
    command:
      - sh
      - -c
      - >-
        wget -qO /tmp/scraper.jar
        https://github.com/open-telemetry/opentelemetry-java-contrib/releases/download/v1.57.0/opentelemetry-jmx-scraper.jar
        && echo '626428c20b254ad8c9ccf5c2c09f297db7bd4498748a2ab5581038b7a9c590fe  /tmp/scraper.jar' > /tmp/scraper.jar.sha256
        && sha256sum -c /tmp/scraper.jar.sha256
        && exec java -Xmx64m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k
        -jar /tmp/scraper.jar -config
        otel.jmx.service.url=service:jmx:rmi:///jndi/rmi://10.0.0.221:9999/jmxrmi
        otel.jmx.target.system=jvm,kafka
        otel.metrics.exporter=otlp
        otel.exporter.otlp.protocol=grpc
        otel.exporter.otlp.endpoint=http://${SIGNOZ_ENDPOINT}:4317
        otel.metric.export.interval=30000
        otel.service.name=kafka
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 256M
      placement:
        constraints: ['node.hostname == unni-kafka-02']
    logging:
      options:
        max-size: '20m'
        max-file: '3'

  jmx-scraper-broker3:
    image: eclipse-temurin:21-jre-alpine
    networks: [hostnet]
    environment:
      OTEL_RESOURCE_ATTRIBUTES: 'host.name=kafka-broker-3,kafka.broker.id=4,server.address=10.0.0.166'
    command:
      - sh
      - -c
      - >-
        wget -qO /tmp/scraper.jar
        https://github.com/open-telemetry/opentelemetry-java-contrib/releases/download/v1.57.0/opentelemetry-jmx-scraper.jar
        && echo '626428c20b254ad8c9ccf5c2c09f297db7bd4498748a2ab5581038b7a9c590fe  /tmp/scraper.jar' > /tmp/scraper.jar.sha256
        && sha256sum -c /tmp/scraper.jar.sha256
        && exec java -Xmx64m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k
        -jar /tmp/scraper.jar -config
        otel.jmx.service.url=service:jmx:rmi:///jndi/rmi://10.0.0.166:9999/jmxrmi
        otel.jmx.target.system=jvm,kafka
        otel.metrics.exporter=otlp
        otel.exporter.otlp.protocol=grpc
        otel.exporter.otlp.endpoint=http://${SIGNOZ_ENDPOINT}:4317
        otel.metric.export.interval=30000
        otel.service.name=kafka
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 256M
      placement:
        constraints: ['node.hostname == unni-kafka-03']
    logging:
      options:
        max-size: '20m'
        max-file: '3'

networks:
  hostnet:
    external: true
    name: host
