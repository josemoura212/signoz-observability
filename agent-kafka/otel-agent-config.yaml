# agent-kafka/otel-agent-config.yaml
#
# Papel: SO metricas de infra (hostmetrics + kafkametrics).
# Telemetria dos consumers (traces/logs/metrics OTLP) vai DIRETO pro collector
# principal (http://10.0.0.173:4317) — receiver otlp e pipelines de app REMOVIDOS.

receivers:
  kafkametrics:
    brokers:
      - ${env:KAFKA_BROKERS}
    protocol_version: 2.0.0
    scrapers:
      - brokers
      - topics
      - consumers
    collection_interval: 30s

  hostmetrics:
    root_path: /hostfs
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      load: {}
      memory: {}
      disk: {}
      filesystem: {}
      network: {}
      paging: {}

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128

  batch:
    send_batch_size: 1500
    timeout: 5s

  resourcedetection:
    detectors: [env, system]
    system:
      hostname_sources: ['os']

  resource:
    attributes:
      - key: service.name
        value: kafka
        action: upsert

exporters:
  otlp_grpc:
    endpoint: ${env:SIGNOZ_ENDPOINT}:4317
    tls:
      insecure: true

service:
  pipelines:
    metrics/host:
      receivers: [hostmetrics]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlp_grpc]

    metrics/kafka:
      receivers: [kafkametrics]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [otlp_grpc]
