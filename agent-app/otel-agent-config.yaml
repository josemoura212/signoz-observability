# agent-app/otel-agent-config.yaml — v3
#
# CAMINHO B: Logs vêm via OTLP do SDK (Pino instrumentado).
# filelog/docker REMOVIDO — evita duplicação.
# Dozzle continua lendo do Docker API normalmente.
#
# O filter processor é safety net pro que escapar do SDK.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # filelog/docker REMOVIDO — logs agora vêm pelo OTLP do SDK

  hostmetrics:
    root_path: /hostfs
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      load: {}
      memory: {}
      disk: {}
      filesystem: {}
      network: {}
      paging: {}
      process:
        mute_process_name_error: true
        mute_process_exe_error: true
        mute_process_io_error: true
        mute_process_user_error: true
      processes: {}

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128

  batch:
    send_batch_size: 1500
    timeout: 5s

  resourcedetection:
    detectors: [env, system]
    system:
      hostname_sources: ["os"]

  # Safety net: dropa spans que escapem da filtragem do SDK
  filter/traces:
    error_mode: ignore
    traces:
      span:
        # Socket.IO polling (principal causa dos 40GB/dia)
        - 'IsMatch(attributes["http.target"], "/socket\\.io.*")'
        # Health checks
        - 'attributes["http.target"] == "/health"'
        - 'attributes["http.target"] == "/healthz"'
        - 'attributes["http.target"] == "/ready"'
        - 'attributes["http.target"] == "/ping"'
        # MongoDB driver internals
        - 'attributes["db.system"] == "mongodb" and IsMatch(name, "mongodb\\.(hello|ismaster|isMaster|buildInfo|ping|endSessions|saslStart|saslContinue).*")'
        # Redis internals
        - 'attributes["db.system"] == "redis" and IsMatch(name, "redis-(ping|info|auth|select|client).*")'

exporters:
  otlp_grpc:
    endpoint: ${env:SIGNOZ_ENDPOINT}:4317
    tls:
      insecure: true

  # debug/logs:
  #   verbosity: detailed
  #   sampling_initial: 5
  #   sampling_thereafter: 50

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/traces, resourcedetection, batch]
      exporters: [otlp_grpc]

    metrics:
      receivers: [otlp, hostmetrics]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlp_grpc]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlp_grpc]
