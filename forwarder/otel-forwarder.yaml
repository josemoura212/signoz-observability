# Encaminhador temporário: fica no host antigo do SigNoz (10.0.0.173) depois da migração e repassa o OTLP para o
# SigNoz novo. Existe só para que apps e agents que ainda apontam para o IP antigo não percam telemetria até cada um
# trocar o endereço. Sai quando o tráfego dele chegar a zero (runbook docs/operations/migracao-signoz-host-proprio.md).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Roda no host do Redis: com o SigNoz novo fora do ar, a fila não pode crescer até disputar memória com o Redis.
  memory_limiter:
    check_interval: 2s
    limit_mib: 1600
    spike_limit_mib: 400
  # Lote pequeno: o receiver OTLP do SigNoz aceita no máximo 4 MB por mensagem gRPC; 10 mil spans passava disso.
  batch:
    send_batch_size: 1000
    send_batch_max_size: 1000
    timeout: 1s

exporters:
  otlp_grpc:
    endpoint: ${env:SIGNOZ_ENDPOINT}:4317
    tls:
      insecure: true
    sending_queue:
      enabled: true
      num_consumers: 16
      queue_size: 2000
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s

service:
  # Métricas do próprio encaminhador em :8888 (só localhost do host): é por elas que se vê quando o tráfego zera.
  telemetry:
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc]
