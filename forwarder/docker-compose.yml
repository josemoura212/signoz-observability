services:
  otel-forwarder:
    image: otel/opentelemetry-collector-contrib:0.146.0
    container_name: otel-forwarder
    restart: unless-stopped
    command: ['--config=https://raw.githubusercontent.com/josemoura212/signoz-observability/main/forwarder/otel-forwarder.yaml']
    environment:
      SIGNOZ_ENDPOINT: ${SIGNOZ_ENDPOINT}
    memswap_limit: 2G
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    ports:
      - '4317:4317'
      - '4318:4318'
      - '127.0.0.1:8888:8888'
    logging:
      options:
        max-size: '20m'
        max-file: '3'
