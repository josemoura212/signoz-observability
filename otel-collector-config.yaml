connectors:
  signozmeter:
    metrics_flush_interval: 1h
    dimensions:
      - name: service.name
      - name: deployment.environment
      - name: host.name

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  hostmetrics:
    root_path: /hostfs
    collection_interval: 30s
    scrapers:
      cpu: {}
      load: {}
      memory: {}
      disk: {}
      filesystem: {}
      network: {}
      paging: {}
  prometheus:
    config:
      global:
        scrape_interval: 30s
      scrape_configs:
        - job_name: otel-collector
          static_configs:
            - targets:
                - localhost:8888
              labels:
                job_name: otel-collector

processors:
  # ~80% do container de 12 GB. Em 07/11 o limite de 6,4 GB recusou ~4 milhões de spans/h no disparo.
  memory_limiter:
    check_interval: 2s
    limit_mib: 9800
    spike_limit_mib: 1960
  # Lote maior = menos inserts no ClickHouse e menos CPU por span no pico.
  batch:
    send_batch_size: 10000
    send_batch_max_size: 20000
    timeout: 2s
  batch/meter:
    send_batch_max_size: 6000
    send_batch_size: 5000
    timeout: 3s
  resourcedetection:
    detectors: [env, system]
    timeout: 2s
  # Safety net global: mesmo filtro dos agents — protege telemetria que chega DIRETO
  # no principal (consumers exportam sem passar por agent). Antes do signozspanmetrics
  # pra nao poluir as metricas APM.
  filter/traces:
    error_mode: ignore
    traces:
      span:
        - 'IsMatch(attributes["http.target"], "/socket\\.io.*")'
        - 'attributes["http.target"] == "/health"'
        - 'attributes["http.target"] == "/healthz"'
        - 'attributes["http.target"] == "/ready"'
        - 'attributes["http.target"] == "/ping"'
        - 'attributes["db.system"] == "mongodb" and IsMatch(name, "mongodb\\.(hello|ismaster|isMaster|buildInfo|ping|endSessions|saslStart|saslContinue).*")'
        - 'attributes["db.system"] == "redis" and IsMatch(name, "redis-(ping|info|auth|select|client).*")'
        # Pico de 07/11: 26% dos spans eram o mesmo read do Firestore em dobro e 9,5% eram pg-pool.connect.
        # BatchGetDocuments é filho de DocumentReference.Get: cortar o filho não deixa span órfão.
        - 'name == "BatchGetDocuments"'
        - 'name == "pg-pool.connect"'
  filter/logs:
    error_mode: ignore
    logs:
      log_record:
        - 'IsMatch(resource.attributes["service.name"], "signoz.*")'
        - 'IsMatch(resource.attributes["service.name"], "otelcol.*")'
        - 'IsMatch(body, ".*\\[console:.*\\].*")'
        - 'IsMatch(body, ".*go\\.opentelemetry\\.io/collector.*")'
        - 'IsMatch(body, ".*sync/waitgroup\\.go.*")'
        - 'IsMatch(body, ".*scraperhelper.*obs_metrics.*")'
        - 'IsMatch(body, ".*MultiTenantAlertmanager.*")'
        - 'IsMatch(body, ".*alertmanager.*stdout output.*")'
        - 'IsMatch(body, ".*org\\.apache\\.kafka\\.common\\.errors.*")'
        - 'IsMatch(body, ".*/checkhealth.*")'
        - 'IsMatch(body, ".*captain-identifier-healthcheck.*")'
        - 'IsMatch(body, ".*signoz-web\\..+\\.unnichat\\.com\\.br.*")'
        - 'IsMatch(body, ".*datadog\\.explain_statement.*")'
        - 'IsMatch(body, ".*permission denied for schema datadog.*")'
  # Head sampling 100% — fica DEPOIS do signozspanmetrics no pipeline, entao as
  # metricas APM (RPS, latencia, error rate) continuam 100% precisas; so o
  # armazenamento de traces brutos no ClickHouse e amostrado.
  probabilistic_sampler:
    sampling_percentage: 100
  # AI observability (v0.143+): SigNoz preenche groups e default_pricing.rules via OpAMP; ficam vazios aqui.
  signozspanmapper:
    groups: []
  signozllmpricing:
    attrs:
      model: gen_ai.request.model
      in: gen_ai.usage.input_tokens
      out: gen_ai.usage.output_tokens
      cache_read: gen_ai.usage.cache_read.input_tokens
      cache_write: gen_ai.usage.cache_creation.input_tokens
    default_pricing:
      rules: []
    output_attrs:
      in: signoz.gen_ai.usage.input_tokens.cost
      out: signoz.gen_ai.usage.output_tokens.cost
      cache_read: signoz.gen_ai.usage.cache_read.input_tokens.cost
      cache_write: signoz.gen_ai.usage.cache_write.input_tokens.cost
      total: signoz.gen_ai.usage.tokens.cost
  signozspanmetrics/delta:
    metrics_exporter: signozclickhousemetrics
    metrics_flush_interval: 15s
    latency_histogram_buckets:
      [100us, 500us, 1ms, 2ms, 4ms, 6ms, 10ms, 25ms, 50ms, 100ms, 200ms, 250ms, 500ms, 750ms, 1000ms, 1400ms, 2000ms, 5s, 10s, 20s, 40s, 60s]
    dimensions_cache_size: 50000
    aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
    enable_exp_histogram: false
    dimensions:
      - name: service.namespace
        default: default
      - name: deployment.environment
        default: default
      - name: signoz.collector.id
      - name: service.version
      - name: host.name
      - name: host.type
      - name: container.name

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777

exporters:
  clickhousetraces:
    datasource: tcp://clickhouse:9000/signoz_traces
    low_cardinal_exception_grouping: ${env:LOW_CARDINAL_EXCEPTION_GROUPING}
    use_new_schema: true
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 8
      queue_size: 100
  signozclickhousemetrics:
    dsn: tcp://clickhouse:9000/signoz_metrics
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
  clickhouselogsexporter:
    dsn: tcp://clickhouse:9000/signoz_logs
    timeout: 30s
    use_new_schema: true
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
  signozclickhousemeter:
    dsn: tcp://clickhouse:9000/signoz_meter
    timeout: 45s
    sending_queue:
      enabled: false
  # Em 07/11 a fila dele segurou ~410 lotes (>1 milhão de spans) e levou o heap ao limite.
  # Metadado é só autocomplete de atributo: fila curta, e se encher ele descarta em vez de prender memória.
  metadataexporter:
    cache:
      provider: in_memory
    dsn: tcp://clickhouse:9000/signoz_metadata
    enabled: true
    timeout: 45s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 20

service:
  telemetry:
    logs:
      encoding: json
  extensions:
    - health_check
    - pprof
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/traces, signozspanmetrics/delta, signozspanmapper, signozllmpricing, probabilistic_sampler, batch]
      exporters: [clickhousetraces, metadataexporter, signozmeter]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [signozclickhousemetrics, metadataexporter, signozmeter]
    metrics/hostmetrics:
      receivers: [hostmetrics]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [signozclickhousemetrics, metadataexporter, signozmeter]
    metrics/prometheus:
      receivers: [prometheus]
      processors: [memory_limiter, batch]
      exporters: [signozclickhousemetrics, metadataexporter, signozmeter]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, filter/logs, batch]
      exporters: [clickhouselogsexporter, metadataexporter, signozmeter]
    metrics/meter:
      receivers: [signozmeter]
      processors: [batch/meter]
      exporters: [signozclickhousemeter]
