connectors:
  signozmeter:
    metrics_flush_interval: 1h
    dimensions:
      - name: service.name
      - name: deployment.environment
      - name: host.name

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  hostmetrics:
    root_path: /hostfs
    collection_interval: 15s
    scrapers:
      cpu: {}
      load: {}
      memory: {}
      disk: {}
      filesystem: {}
      network: {}
      paging: {}
      process:
        mute_process_name_error: true
        mute_process_exe_error: true
        mute_process_io_error: true
        mute_process_user_error: true
      processes: {}
  prometheus:
    config:
      global:
        scrape_interval: 30s
      scrape_configs:
        - job_name: otel-collector
          static_configs:
            - targets:
                - localhost:8888
              labels:
                job_name: otel-collector

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 4096
    spike_limit_mib: 768
  batch:
    send_batch_size: 3000
    send_batch_max_size: 4000
    timeout: 3s
  batch/meter:
    send_batch_max_size: 6000
    send_batch_size: 5000
    timeout: 3s
  resourcedetection:
    detectors: [env, system]
    timeout: 2s
  filter/logs:
    error_mode: ignore
    logs:
      log_record:
        - 'IsMatch(resource.attributes["service.name"], "signoz.*")'
        - 'IsMatch(resource.attributes["service.name"], "otelcol.*")'
        - 'IsMatch(body, ".*i\\.c\\.m\\.i\\.c\\..*")'
        - 'IsMatch(body, ".*i\\.c\\.o\\.ObservabilityTaskBuilder.*")'
        - 'IsMatch(body, ".*go\\.opentelemetry\\.io/collector.*")'
        - 'IsMatch(body, ".*sync/waitgroup\\.go.*")'
        - 'IsMatch(body, ".*scraperhelper.*obs_metrics.*")'
        - 'IsMatch(body, ".*MultiTenantAlertmanager.*")'
        - 'IsMatch(body, ".*/checkhealth.*")'
        - 'IsMatch(body, ".*captain-identifier-healthcheck.*")'
        - 'IsMatch(body, ".*signoz-web\\..+\\.unnichat\\.com\\.br.*")'
        - 'IsMatch(body, ".*datadog\\.explain_statement.*")'
        - 'IsMatch(body, ".*permission denied for schema datadog.*")'
  signozspanmetrics/delta:
    metrics_exporter: signozclickhousemetrics
    metrics_flush_interval: 15s
    latency_histogram_buckets:
      [100us, 500us, 1ms, 2ms, 4ms, 6ms, 10ms, 25ms, 50ms, 100ms, 200ms, 250ms, 500ms, 750ms, 1000ms, 1400ms, 2000ms, 5s, 10s, 20s, 40s, 60s]
    dimensions_cache_size: 200000
    aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
    enable_exp_histogram: false
    dimensions:
      - name: service.namespace
        default: default
      - name: deployment.environment
        default: default
      - name: signoz.collector.id
      - name: service.version
      - name: browser.platform
      - name: browser.mobile
      - name: k8s.cluster.name
      - name: k8s.node.name
      - name: k8s.namespace.name
      - name: host.name
      - name: host.type
      - name: container.name

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777

exporters:
  clickhousetraces:
    datasource: tcp://clickhouse:9000/signoz_traces
    low_cardinal_exception_grouping: ${env:LOW_CARDINAL_EXCEPTION_GROUPING}
    use_new_schema: true
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 8
      queue_size: 1000
  signozclickhousemetrics:
    dsn: tcp://clickhouse:9000/signoz_metrics
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
  clickhouselogsexporter:
    dsn: tcp://clickhouse:9000/signoz_logs
    timeout: 30s
    use_new_schema: true
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
  signozclickhousemeter:
    dsn: tcp://clickhouse:9000/signoz_meter
    timeout: 45s
    sending_queue:
      enabled: false
  metadataexporter:
    cache:
      provider: in_memory
    dsn: tcp://clickhouse:9000/signoz_metadata
    enabled: true
    timeout: 45s

service:
  telemetry:
    logs:
      encoding: json
  extensions:
    - health_check
    - pprof
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, signozspanmetrics/delta, batch]
      exporters: [clickhousetraces, metadataexporter, signozmeter]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [signozclickhousemetrics, metadataexporter, signozmeter]
    metrics/hostmetrics:
      receivers: [hostmetrics]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [signozclickhousemetrics, metadataexporter, signozmeter]
    metrics/prometheus:
      receivers: [prometheus]
      processors: [memory_limiter, batch]
      exporters: [signozclickhousemetrics, metadataexporter, signozmeter]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, filter/logs, batch]
      exporters: [clickhouselogsexporter, metadataexporter, signozmeter]
    metrics/meter:
      receivers: [signozmeter]
      processors: [batch/meter]
      exporters: [signozclickhousemeter]
