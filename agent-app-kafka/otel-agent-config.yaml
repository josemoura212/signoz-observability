receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  filelog/docker:
    include:
      - /hostfs/var/lib/docker/containers/*/*-json.log
    include_file_path: true
    include_file_name: false
    start_at: end
    operators:
      - type: json_parser
        id: docker_json
      - type: move
        from: attributes.log
        to: body
      - type: move
        from: attributes.stream
        to: attributes["log.iostream"]
      - type: remove
        field: attributes.time
      - type: regex_parser
        id: extract_container_id
        parse_from: attributes["log.file.path"]
        regex: '/containers/(?P<container_id>[a-f0-9]{12})'
        on_error: send
      - type: move
        if: attributes.container_id != nil
        from: attributes.container_id
        to: resource["container.id"]

  kafkametrics:
    brokers:
      - ${env:KAFKA_BROKERS}
    protocol_version: 2.0.0
    scrapers:
      - brokers
      - topics
      - consumers
    collection_interval: 30s

  hostmetrics:
    root_path: /hostfs
    collection_interval: 30s
    scrapers:
      cpu: {}
      load: {}
      memory: {}
      disk: {}
      filesystem: {}
      network: {}
      paging: {}
      process:
        mute_process_name_error: true
        mute_process_exe_error: true
        mute_process_io_error: true
      processes: {}

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128

  batch:
    send_batch_size: 1500
    timeout: 5s

  resourcedetection:
    detectors: [env, system]
    system:
      hostname_sources: ['os']

exporters:
  otlp_grpc:
    endpoint: ${env:SIGNOZ_ENDPOINT}:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlp_grpc]

    metrics:
      receivers: [otlp, hostmetrics, kafkametrics]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlp_grpc]

    logs:
      receivers: [otlp, filelog/docker]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlp_grpc]
