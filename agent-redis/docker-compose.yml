services:
  otel-agent:
    image: otel/opentelemetry-collector-contrib:0.146.0
    container_name: otel-agent-redis
    hostname: ${HOST_NAME}
    restart: unless-stopped
    command: ['--config=https://raw.githubusercontent.com/josemoura212/signoz-observability/main/agent-redis/otel-agent-config.yaml']
    volumes:
      - /:/hostfs:ro
      - /etc/passwd:/etc/passwd:ro
    environment:
      HOST_PROC: /hostfs/proc
      HOST_SYS: /hostfs/sys
      HOST_ETC: /hostfs/etc
      HOST_VAR: /hostfs/var
      SIGNOZ_ENDPOINT: ${SIGNOZ_ENDPOINT:?defina SIGNOZ_ENDPOINT}
      REDIS_SOCKET_ENDPOINT: ${REDIS_SOCKET_ENDPOINT:-host.docker.internal:6379}
      REDIS_SOCKET_PASSWORD: ${REDIS_SOCKET_PASSWORD:?defina REDIS_SOCKET_PASSWORD}
      REDIS_CACHE_ENDPOINT: ${REDIS_CACHE_ENDPOINT:-host.docker.internal:6377}
      REDIS_CACHE_PASSWORD: ${REDIS_CACHE_PASSWORD:?defina REDIS_CACHE_PASSWORD}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    pid: host
    logging:
      options:
        max-size: '20m'
        max-file: '3'
