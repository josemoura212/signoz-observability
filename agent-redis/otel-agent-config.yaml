receivers:
  # Duas instâncias no mesmo host: socket (adapter do Socket.IO) e cache (cache, locks, claims).
  redis/socket:
    endpoint: ${env:REDIS_SOCKET_ENDPOINT}
    password: ${env:REDIS_SOCKET_PASSWORD}
    collection_interval: 30s
    metrics:
      redis.maxmemory:
        enabled: true
      redis.cmd.calls:
        enabled: true
      redis.cmd.usec:
        enabled: true
      redis.cmd.latency:
        enabled: true

  redis/cache:
    endpoint: ${env:REDIS_CACHE_ENDPOINT}
    password: ${env:REDIS_CACHE_PASSWORD}
    collection_interval: 30s
    metrics:
      redis.maxmemory:
        enabled: true
      redis.cmd.calls:
        enabled: true
      redis.cmd.usec:
        enabled: true
      redis.cmd.latency:
        enabled: true

  hostmetrics:
    root_path: /hostfs
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      load: {}
      memory: {}
      disk: {}
      filesystem: {}
      network: {}
      paging: {}

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128

  batch:
    send_batch_size: 1500
    timeout: 5s

  resourcedetection:
    detectors: [env, system]
    system:
      hostname_sources: ['os']

  resource/socket:
    attributes:
      - key: service.name
        value: redis
        action: upsert
      - key: redis.instance
        value: socket
        action: upsert

  resource/cache:
    attributes:
      - key: service.name
        value: redis
        action: upsert
      - key: redis.instance
        value: cache
        action: upsert

exporters:
  otlp_grpc:
    endpoint: ${env:SIGNOZ_ENDPOINT}:4317
    tls:
      insecure: true

service:
  pipelines:
    metrics/host:
      receivers: [hostmetrics]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlp_grpc]
    metrics/redis-socket:
      receivers: [redis/socket]
      processors: [memory_limiter, resourcedetection, resource/socket, batch]
      exporters: [otlp_grpc]
    metrics/redis-cache:
      receivers: [redis/cache]
      processors: [memory_limiter, resourcedetection, resource/cache, batch]
      exporters: [otlp_grpc]
