receivers:
  hostmetrics:
    root_path: /hostfs
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      load: {}
      memory: {}
      disk: {}
      filesystem: {}
      network: {}
      paging: {}

  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 30s
    excluded_images:
      - "*opentelemetry-collector*"
    container_labels_to_metric_labels:
      com.docker.swarm.service.name: swarm.service.name
    metrics:
      container.cpu.utilization:
        enabled: true
      container.memory.usage.total:
        enabled: true
      container.memory.percent:
        enabled: true
      container.network.io.usage.tx_bytes:
        enabled: true
      container.network.io.usage.rx_bytes:
        enabled: true

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128

  resourcedetection:
    detectors: [env, system]
    system:
      hostname_sources: ['os']

  batch:
    send_batch_size: 1500
    timeout: 5s

exporters:
  otlp_grpc:
    endpoint: ${env:SIGNOZ_ENDPOINT}:4317
    tls:
      insecure: true

service:
  telemetry:
    metrics:
      level: none
  pipelines:
    metrics/host:
      receivers: [hostmetrics]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlp_grpc]

    metrics/containers:
      receivers: [docker_stats]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlp_grpc]
