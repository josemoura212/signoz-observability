services:
  otel-agent:
    image: otel/opentelemetry-collector-contrib:0.146.0
    container_name: otel-agent-db
    hostname: ${HOST_NAME}
    restart: unless-stopped
    command: ["--config=https://raw.githubusercontent.com/josemoura212/signoz-observability/main/agent-db/otel-agent-config.yaml"]
    volumes:
      - /:/hostfs:ro
      - /etc/passwd:/etc/passwd:ro
      - ${PG_LOG_PATH:-/var/lib/postgresql/17/main/pg_log}:/var/log/postgresql:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    environment:
      HOST_PROC: /hostfs/proc
      HOST_SYS: /hostfs/sys
      HOST_ETC: /hostfs/etc
      HOST_VAR: /hostfs/var
      SIGNOZ_ENDPOINT: ${SIGNOZ_ENDPOINT}
      PG_HOST: ${PG_HOST:-host.docker.internal}
      PG_PORT: ${PG_PORT:-5432}
      PG_USER: ${PG_MONITOR_USER}
      PG_PASSWORD: ${PG_MONITOR_PASSWORD}
      PG_DATABASE: ${PG_DATABASE:-unnichat}
      PG_SERVICE_NAME: ${PG_SERVICE_NAME:-postgresql}
      PG_ROLE: ${PG_ROLE:-primary}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    pid: host
    logging:
      options:
        max-size: "20m"
        max-file: "3"

  # Traduz o console admin do PgBouncer em metricas Prometheus (:9127).
  # network_mode: host -> alcanca o pgbouncer em 127.0.0.1 e publica :9127 no host,
  # que o otel-agent-db scrapeia via host.docker.internal:9127.
  pgbouncer-exporter:
    image: prometheuscommunity/pgbouncer-exporter:latest
    container_name: pgbouncer-exporter
    restart: unless-stopped
    network_mode: host
    command:
      - "--pgBouncer.connectionString=postgres://${PGBOUNCER_STATS_USER:-datadog}:${PGBOUNCER_STATS_PASSWORD}@127.0.0.1:${PGBOUNCER_PORT:-16543}/pgbouncer?sslmode=disable"
      - "--web.listen-address=:9127"
    logging:
      options:
        max-size: "10m"
        max-file: "3"
